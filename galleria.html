<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#172A43">

  <title>Galleria Storica | Corpo Bandistico Municipale “G. Verdi”</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --navy: #172A43;
      --navy-light: #243D5B;
      --blue: #53799F;
      --blue-hover: #3F6488;
      --white: #FFFFFF;
      --light: #EDF2F7;
      --light-blue: #F5F8FB;
      --text: #303943;
      --muted: #657181;
      --border: #DCE4EC;
      --shadow: 0 10px 30px rgba(23, 42, 67, 0.08);
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--white);
      color: var(--text);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3 {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 500;
      line-height: 1.2;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    img {
      max-width: 100%;
    }

    /* HEADER */

    header {
      background: var(--navy);
      color: var(--white);
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 25px;
      padding: 17px 5%;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--white);
      flex-shrink: 0;
    }

    .logo img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      border-radius: 50%;
      background: var(--white);
      padding: 3px;
    }

    .logo span {
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 1.3px;
      white-space: nowrap;
    }

    .header-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 20px;
      flex-wrap: wrap;
    }

    nav {
      display: flex;
      gap: 17px;
      flex-wrap: wrap;
      align-items: center;
    }

    nav a {
      color: var(--white);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.45px;
      text-transform: uppercase;
      transition: color 0.2s;
      white-space: nowrap;
    }

    nav a:hover,
    nav a.active {
      color: #AFC8E1;
    }

    .search-box input {
      width: 145px;
      padding: 9px 13px;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 24px;
      outline: none;
      background: rgba(255,255,255,0.08);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
    }

    .search-box input::placeholder {
      color: #DCE4EC;
    }

    /* INTRODUZIONE */

    .hero {
      background: var(--navy);
      color: var(--white);
      padding: 65px 24px 60px;
      text-align: center;
    }

    .eyebrow {
      color: #AFC8E1;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 14px;
    }

    .hero h1 {
      font-size: clamp(34px, 5vw, 54px);
      font-weight: normal;
      line-height: 1.2;
      margin-bottom: 18px;
    }

    .hero p {
      max-width: 670px;
      margin: 0 auto;
      color: #DCE4EC;
      font-size: 15px;
    }

    .hero-line {
      width: 65px;
      height: 2px;
      background: var(--blue);
      margin: 25px auto 0;
    }
